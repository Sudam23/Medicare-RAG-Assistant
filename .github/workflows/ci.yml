name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, and check the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Tests
        run: pytest -q

      # Every accuracy figure in the README and the docs is generated from
      # docs/evaluation_report.json. This fails the build if someone edits a
      # number by hand, or re-runs the evaluation without regenerating the docs.
      - name: The published numbers match the evaluation report
        run: python scripts/render_results.py --check

  docker:
    name: Build the container and prove it answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t medicare-rag-assistant:ci .

      - name: Boot it and exercise the API
        run: |
          docker run -d --name medicare -p 8000:8000 medicare-rag-assistant:ci
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/health | grep -q '"index_ready":true'; then
              echo "service is ready after ${attempt}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"index_ready":true'

          # An in-scope question is answered and cites a real booklet.
          curl -sf "http://127.0.0.1:8000/api/ask?q=Does+Medicare+cover+dental+care%3F&k=4" \
            | tee /tmp/answer.json | grep -q '"strategy":"extractive"'
          grep -q 'medicare.gov/publications' /tmp/answer.json

          # An out-of-scope question is refused rather than answered.
          curl -sf "http://127.0.0.1:8000/api/ask?q=What+is+the+best+stock+to+buy%3F&k=4" \
            | grep -q '"strategy":"refused"'

          # A question carrying a Medicare number never reaches retrieval.
          curl -sf "http://127.0.0.1:8000/api/ask?q=my+MBI+is+1EG4-TE5-MK73&k=4" \
            | grep -q '"strategy":"refused"'

          curl -sf http://127.0.0.1:8000/ | grep -qi "Medicare"
          docker logs medicare | tail -20
          docker rm -f medicare
